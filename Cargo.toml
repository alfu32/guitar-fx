[package]
name = "guitar-fx"
version = "0.9.0"
edition = "2024"

[lib]
name = "guitar_fx_core"
path = "src/lib.rs"

[[bin]]
name = "guitar-fx"
path = "src/main.rs"

[features]
default = ["ui"]
ui = ["dep:eframe", "dep:acorde-io", "dep:acorde-render-svg", "dep:resvg"]

[[bin]]
name = "guitar-fx-ui"
path = "src/bin/guitar-fx-ui.rs"
required-features = ["ui"]

[dependencies]
cpal = "0.18"
acorde-io = { version = "2", features = ["abc"], optional = true }
acorde-render-svg = { version = "2", optional = true }
eframe = { version = "0.37.0", optional = true }
fundsp = "0.23"
hound = "3.5"
ringbuf = "0.4"
resvg = { version = "0.50", default-features = false, optional = true }
serde_json = "1"
signalsmith-stretch = "0.1"
