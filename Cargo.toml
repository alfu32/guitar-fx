[package]
name = "guitarfx"
version = "0.5.0"
edition = "2024"

[lib]
name = "guitarfx_core"
path = "src/lib.rs"

[[bin]]
name = "guitarfx"
path = "src/main.rs"

[features]
default = ["ui"]
ui = ["dep:eframe"]

[[bin]]
name = "guitarfx-ui"
path = "src/bin/guitarfx-ui.rs"
required-features = ["ui"]

[dependencies]
cpal = "0.18"
eframe = { version = "0.37.0", optional = true }
fundsp = "0.23"
hound = "3.5"
ringbuf = "0.4"
signalsmith-stretch = "0.1"
