[package]
name = "guitar-fx"
version = "0.7.2"
edition = "2024"

[lib]
name = "guitar_fx_core"
path = "src/lib.rs"

[[bin]]
name = "guitar-fx"
path = "src/main.rs"

[features]
default = ["ui"]
ui = ["dep:eframe"]

[[bin]]
name = "guitar-fx-ui"
path = "src/bin/guitar-fx-ui.rs"
required-features = ["ui"]

[dependencies]
cpal = "0.18"
eframe = { version = "0.37.0", optional = true }
fundsp = "0.23"
hound = "3.5"
ringbuf = "0.4"
signalsmith-stretch = "0.1"
