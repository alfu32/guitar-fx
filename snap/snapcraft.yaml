name: guitar-fx
title: guitar-fx
summary: Multi-effect guitar processor with live, low-latency monitoring
description: |
  An ordered, repeatable chain of guitar effects (amp models, cabinet impulse
  responses, noise gate, EQ, modulation, delay, reverb, pitch effects) with
  live parameter changes, tuner, looper and metronome.
adopt-info: guitar-fx
base: core24
grade: stable
confinement: strict
license: MIT
platforms:
  amd64:
  arm64:
apps:
  guitar-fx:
    command: bin/guitar-fx-ui
    extensions: []
    plugs: [home, desktop, desktop-legacy, wayland, x11, opengl, audio-playback, audio-record, alsa, removable-media]
    environment:
      XDG_CONFIG_HOME: $SNAP_USER_COMMON/.config
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:$LD_LIBRARY_PATH
  cli:
    command: bin/guitar-fx
    plugs: [home, audio-playback, audio-record, alsa]
parts:
  guitar-fx:
    plugin: rust
    source: .
    rust-channel: stable
    build-packages: [pkg-config, libasound2-dev]
    stage-packages: [libasound2t64, libasound2-plugins, libvulkan1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libx11-6, libxcursor1, libxi6, libxrandr2, libgl1, libegl1]
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
